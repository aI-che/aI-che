# GitHub Action for generating a contribution graph with a snake eating your contributions.

name: Generate Snake

# Controls when the action will run. This action runs every 6 hours.

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"

  # Allows the Action to be run manually from the Actions tab.
  workflow_dispatch:

# Give GitHub Actions permission to write to the repository.
permissions:
  contents: write

# The sequence of runs in this workflow:
jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # Checks the repository so the job can access it.
      - uses: actions/checkout@v4

      # Generates the snake.
      - uses: Platane/snk@master
        id: snake-gif
        with:
          github_user_name: aI-che
          gif_out_path: dist/github-contribution-grid-snake.gif
          svg_out_path: dist/github-contribution-grid-snake.svg

      # Show the status of the build.
      - name: Check generated files
        run: |
          git status
          ls -la dist

      # Push the generated files to the output branch.
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: output
          force: true

      # Publish the output directory to the output branch.
      - uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
